name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.entry.node }} with ESLint ${{ matrix.entry.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { node: "22.13.0", eslint: "9.39.5", js: "9.39.5" }
          - { node: "22.13.0", eslint: "10.14.0", js: "10.0.1" }
          - { node: "26.13.0", eslint: "9.39.5", js: "9.39.5" }
          - { node: "26.13.0", eslint: "10.14.0", js: "10.0.1" }
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.entry.node }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Select ESLint Compatibility Pair
        run: npm install --no-save --package-lock=false eslint@${{ matrix.entry.eslint }} @eslint/js@${{ matrix.entry.js }}
      - name: Run Tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests with Coverage
        run: npm run test:coverage
      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage/lcov.info
          format: lcov
